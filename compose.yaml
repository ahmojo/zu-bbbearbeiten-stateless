services:
  database:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: ${DBUSER:-todo}
      POSTGRES_PASSWORD: ${DBPASS:-todo-local-password}
      POSTGRES_DB: ${DBNAME:-todo}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBUSER:-todo} -d ${DBNAME:-todo}"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DBUSER: ${DBUSER:-todo}
      DBPASS: ${DBPASS:-todo-local-password}
      DBHOST: database
      DBPORT: 5432
      DBNAME: ${DBNAME:-todo}
      DBSSLMODE: disable
    ports:
      - "8000:8000"

volumes:
  postgres-data:
